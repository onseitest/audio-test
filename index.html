<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音声一覧</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    .item { margin-bottom: 1.5rem; }
    .item h2 { font-size: 1rem; margin: 0 0 .4rem; }
    audio { width: 100%; }
  </style>
</head>
<body>
  <h1>音声一覧</h1>
  <div id="list"></div>

  <script>
    const ext = "mp3";   // 拡張子
    const count = 15;    // 音声の数

    const list = document.getElementById("list");
    for (let i = 1; i <= count; i++) {
      list.insertAdjacentHTML("beforeend", `
        <div class="item">
          <h2>test${i}</h2>
          <audio controls preload="none" src="audio/test${i}.${ext}"></audio>
        </div>`);
    }

    // 1つ再生したら、他の音声を自動で止める
    const players = document.querySelectorAll("audio");
    players.forEach(p => {
      p.addEventListener("play", () => {
        players.forEach(o => { if (o !== p) o.pause(); });
      });
    });
  </script>
</body>
</html>
